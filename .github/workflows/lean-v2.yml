name: Lean v2 proof check

on:
  push:
    branches: [w1s-lean-keep-relaxation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: v2/lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Add swap
        working-directory: .
        run: |
          sudo swapoff -a || true
          dir=/mnt; [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -ge 20 ] || dir=/
          sudo fallocate -l 12G "$dir/swapfile2" && sudo chmod 600 "$dir/swapfile2"
          sudo mkswap "$dir/swapfile2" && sudo swapon "$dir/swapfile2"
          free -h; df -h / /mnt || true

      - name: Cache elan toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ env.ELAN_VERSION }}-leanprover-lean4-v4.35.0

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/elan.tar.gz" \
              "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
            mkdir -p "$RUNNER_TEMP/elan"
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
            "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: lake build ECDLPv2 Verify (no sorry outside Challenge.lean)
        run: |
          lake build ECDLPv2 Verify 2>&1 | tee "$RUNNER_TEMP/lake-build-v2.log"
          if grep -F "declaration uses 'sorry'" "$RUNNER_TEMP/lake-build-v2.log" | grep -v -E '(^|[ /])Challenge\.lean:'; then
            echo "::error::sorry outside Challenge.lean"; exit 1
          fi

      - name: Verify v2 theorem axioms
        run: lake env lean Verify.lean 2>&1 | tee "$RUNNER_TEMP/axioms-v2.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-v2-check-logs
          path: |
            ${{ runner.temp }}/lake-build-v2.log
            ${{ runner.temp }}/axioms-v2.log
          if-no-files-found: ignore
          retention-days: 30
